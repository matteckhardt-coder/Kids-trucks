<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="City Helpers — a kids' game: drive city trucks to do their jobs, level up, and unlock new trucks." />
  <meta name="theme-color" content="#6cae57" />
  <title>🏙️ City Helpers</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="renderCanvas" touch-action="none"></canvas>

  <div id="splash" class="splash">
    <div class="splash-truck">🚒</div>
    <div class="splash-title">City Helpers</div>
    <div class="splash-tip">Starting the engines…</div>
  </div>

  <div id="ui" class="ui hidden">
    <div id="machine-picker" class="machine-picker" aria-label="Choose a truck"></div>

    <div id="topstat" class="topstat">
      <span id="level" class="lvl">Lvl 1</span>
      <div class="xp-meter"><div id="xp-fill" class="xp-fill"></div></div>
      <span id="done" class="done">✅ 0</span>
    </div>

    <div id="goal" class="goal">
      <span id="goal-text">Drive a truck to a job!</span>
      <div class="goal-meter"><div id="goal-fill" class="goal-fill"></div></div>
    </div>

    <div id="joystick" class="joystick" aria-hidden="true"><div id="joystick-knob" class="joystick-knob"></div></div>

    <div class="action-buttons">
      <button id="btn-spray" class="action-btn spray" type="button" aria-label="Spray water">SPRAY</button>
    </div>

    <div class="hud">
      <div id="machine-label" class="machine-label">Fire Truck</div>
      <button id="btn-mute" class="flatten-btn" type="button" aria-label="Sound on or off">🔊</button>
    </div>

    <div id="cheer" class="cheer hidden"></div>
  </div>

  <script src="vendor/babylon.js"></script>
  <script src="vendor/babylonjs.loaders.min.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
